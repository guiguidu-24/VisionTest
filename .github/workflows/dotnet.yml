# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: VisionTest.Core unit tests

on:
  push:
    branches: [ "master" , "GhActions"]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet: ['9.0.x', '8.0.x']
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
          dotnet-version: ${{ matrix.dotnet }}
    - name: Restore dependencies Core
      run: dotnet restore .\VisionTest.Core\VisionTest.Core.csproj
    - name: Restore dependencies Tests
      run: dotnet restore .\VisionTest.Tests\VisionTest.Tests.csproj
    - name: Build
      run: dotnet build .\VisionTest.Tests\VisionTest.Tests.csproj --no-restore
    - name: Test without Screen tests
      run: dotnet test .\VisionTest.Tests\VisionTest.Tests.csproj --filter "FullyQualifiedName~VisionTest.Tests.Core&TestCategory!=Screen" --no-build --verbosity normal
